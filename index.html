
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A digital clock and stopwatch with start, pause and reset controls.">
    <title>Digital Clock & Stopwatch</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <h1>Time<span>Zone</span></h1>
            <p>Your time, precisely measured.</p>
        </header>

        <section class="panel clock-panel" aria-labelledby="clock-heading">
            <p class="eyebrow">CURRENT TIME</p>
            <h2 id="clock-heading">Digital Clock</h2>

            <div class="clock-display" id="clock" aria-label="Current time">
                00:00:00
            </div>

            <p class="date-display" id="date">Loading date...</p>
            <p class="timezone" id="timezone">Local time</p>
        </section>

        <section class="panel stopwatch-panel" aria-labelledby="stopwatch-heading">
            <p class="eyebrow">MEASURE YOUR TIME</p>
            <h2 id="stopwatch-heading">Stopwatch</h2>

            <div class="stopwatch-display" id="stopwatch" role="timer"
                aria-label="Stopwatch elapsed time">
                00:00:00.00
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn-start" type="button">
                    Start
                </button>
                <button id="pause-btn" class="btn btn-pause" type="button" disabled>
                    Pause
                </button>
                <button id="reset-btn" class="btn btn-reset" type="button">
                    Reset
                </button>
            </div>

            <p id="stopwatch-status" class="status" aria-live="polite">
                Stopwatch is ready.
            </p>
        </section>

        <footer class="footer">
            <p>Built with HTML, CSS & JavaScript</p>
            <p>&copy; <span id="year"></span> TimeZone</p>
        </footer>
    </main>
</body>
</html>
